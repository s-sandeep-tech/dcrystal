services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=meetaccess
      - POSTGRES_PASSWORD=meetpass
      - POSTGRES_DB=dcrystaldb
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U meetaccess -d dcrystaldb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./uploads:/shared_uploads

  redis:
    image: redis:alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    env_file: .env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://meetaccess:meetpass@db:5432/dcrystaldb
      - REDIS_HOST=redis
      - FLASK_DEBUG=false
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=4
      - GUNICORN_TIMEOUT=300
      - GUNICORN_GRACEFUL_TIMEOUT=60
      - SQLALCHEMY_POOL_SIZE=4
      - SQLALCHEMY_MAX_OVERFLOW=2
      - SQLALCHEMY_POOL_TIMEOUT=30
      - SQLALCHEMY_POOL_RECYCLE=1800
      - SQLALCHEMY_CONNECT_TIMEOUT=30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5); payload = json.load(response); assert response.status == 200 and payload.get('status') == 'healthy'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sync-consumer:
    build: ./sync-consumer
    env_file: .env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://meetaccess:meetpass@db:5432/dcrystaldb
      - REDIS_HOST=redis
      - PYTHONPATH=/app:/app/server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./sync-consumer:/app
      - ./server:/app/server
      - ./uploads:/app/uploads

  socket-server:
    build: ./socket-server
    env_file: .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./socket-server:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8090:80"
    depends_on:
      server:
        condition: service_healthy
      socket-server:
        condition: service_started
