events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Existing dcrystal upstreams
    upstream flask_backend {
        server server:5000;
    }

    upstream socket_server {
        server socket-server:3000;
    }

    # Upstox nginx (now reachable via stox_default network)
    upstream upstox_proxy_upstream {
        server upstox_proxy:80;
    }

    server {
        listen 80;

        # -------------------------
        # DCRYSTAL APP (existing)
        # -------------------------
        location / {
            proxy_pass http://flask_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://flask_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /realtimedata/ {
            proxy_pass http://socket_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # -------------------------
        # UPSTOX APP under /stox/
        # -------------------------

        # /stox -> /stox/
        location = /stox {
            return 301 /stox/;
        }

        # Main UI under /stox/
        location /stox/ {
            proxy_pass http://upstox_proxy_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO under /stox/socket.io/
        location /stox/socket.io/ {
            proxy_pass http://upstox_proxy_upstream/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
