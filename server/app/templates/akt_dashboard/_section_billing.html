<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 h-[400px]">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide">Per Minute Billing Efficiency</h4>
                <p class="text-[10px] text-gray-400">Time-based operational velocity</p>
            </div>
            <span class="text-[10px] px-2.5 py-1 bg-primary/10 text-primary rounded-full font-bold uppercase tracking-widest">Primary KPI</span>
        </div>
        <div class="h-[300px]">
            <canvas id="chart-per-min-efficiency"></canvas>
        </div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 h-[400px]">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide">Hourly Billing Count</h4>
                <p class="text-[10px] text-gray-400">Transaction volume by hour</p>
            </div>
            <span class="text-[10px] px-2.5 py-1 bg-gray-100 dark:bg-gray-700 text-gray-500 rounded-full font-bold uppercase tracking-widest">Secondary</span>
        </div>
        <div class="h-[300px]">
            <canvas id="chart-hourly-count"></canvas>
        </div>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 h-[450px]">

        <div class="h-[350px]">
            <canvas id="chart-per-min-location"></canvas>
        </div>
    </div>

    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 h-[450px]">
        <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wide mb-6">Hourly Billing by Location</h4>

        </div>
    </div>
</div>
