<div class="flex flex-wrap items-center gap-3 bg-white dark:bg-gray-800 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Date</label>
        <input type="date" id="filter-date" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[140px]">
    </div>
    
    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Country</label>
        <select id="filter-country" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[120px]">
            <option value="India" selected>India</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Region</label>
        <select id="filter-region" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[120px]">
            <option value="">All Regions</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">State</label>
        <select id="filter-state" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[120px]">
            <option value="">All States</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Location</label>
        <select id="filter-location" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[160px]">
            <option value="">All Locations</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Division</label>
        <select id="filter-division" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[120px]">
            <option value="">All Divisions</option>
        </select>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[9px] font-bold text-gray-400 uppercase ml-1">Subledger</label>
        <select id="filter-subledger" class="bg-gray-50 dark:bg-gray-900 border-gray-200 dark:border-gray-700 rounded-lg text-xs p-2 min-w-[120px]">
            <option value="">All Subledgers</option>
        </select>
    </div>

    <div class="flex items-end h-full ml-auto gap-2">
        <button onclick="resetFilters()" class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-200 transition-all flex items-center gap-2 shadow-sm mb-0.5">
            <span class="material-symbols-outlined text-sm">restart_alt</span> Reset
        </button>
        <button onclick="loadDashboardData()" class="bg-primary text-white px-5 py-2 rounded-lg text-xs font-bold hover:bg-blue-600 transition-all flex items-center gap-2 shadow-md mb-0.5">
            <span class="material-symbols-outlined text-sm">refresh</span> Refresh
        </button>
    </div>
</div>
