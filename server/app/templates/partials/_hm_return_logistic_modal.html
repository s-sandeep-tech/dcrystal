
<div class="overflow-x-auto p-4">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-800">
        <thead class="bg-orange-50 dark:bg-orange-900/20">
            <tr>
                <th class="px-3 py-2 text-left text-[10px] font-bold text-orange-600 uppercase">Logistic Mobile No</th>
                <th class="px-3 py-2 text-left text-[10px] font-bold text-orange-600 uppercase">Logistic Date</th>
                <th class="px-3 py-2 text-left text-[10px] font-bold text-orange-600 uppercase">Vehicle No</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
            {% for d in details %}
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/50">
                <td class="px-3 py-2 whitespace-nowrap text-[11px] font-bold text-gray-700"><span class="flex items-center gap-1"><span class="material-symbols-outlined text-[13px] text-orange-400">smartphone</span> {{ d.logistic_mobile_no or '-' }}</span></td>
                <td class="px-3 py-2 whitespace-nowrap text-[11px] text-gray-600">{{ d.logistic_date.strftime('%Y-%m-%d %H:%M') if d.logistic_date else '-' }}</td>
                <td class="px-3 py-2 whitespace-nowrap text-[11px] font-bold text-gray-700">{{ d.vehicle_no or '-' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
