<!-- Menu Tab Content -->
<div
    class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/30 dark:bg-gray-800/20 flex items-center justify-between shrink-0">
    <div>
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Manage Menus</h3>
        <p class="text-[10px] text-gray-500 mt-0.5">Configure sidebar navigation items and permissions.</p>
    </div>
    <button onclick="openMenuModal()"
        class="bg-primary hover:bg-blue-600 text-white px-3 py-1.5 rounded text-[11px] font-bold uppercase tracking-wider transition-colors flex items-center gap-1 shadow-md shadow-primary/20">
        <span class="material-symbols-outlined text-sm">add</span> New Menu
    </button>
</div>
<div class="p-0 overflow-x-auto overflow-y-auto max-h-[500px] flex-1">
    <table class="w-full text-left text-[11px] text-gray-500 dark:text-gray-400 border-collapse">
        <thead
            class="text-[10px] text-gray-400 uppercase bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-10">
            <tr>
                <th scope="col" class="px-4 py-3 font-semibold w-[5%] bg-gray-50 dark:bg-gray-800">ID</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[25%] bg-gray-50 dark:bg-gray-800">Title</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[20%] bg-gray-50 dark:bg-gray-800">URL</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[20%] bg-gray-50 dark:bg-gray-800">Permission</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[15%] bg-gray-50 dark:bg-gray-800">Order</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[15%] text-right bg-gray-50 dark:bg-gray-800">Actions
                </th>
            </tr>
        </thead>
        <tbody id="menusTableBody" class="divide-y divide-gray-100 dark:divide-gray-800">
            <tr>
                <td colspan="6" class="px-4 py-8 text-center text-gray-400">
                    <span class="material-symbols-outlined block text-2xl mb-2 animate-spin">sync</span>
                    Loading menus...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Menu Modal (Moved from end of settings page) -->
<div id="menuModal"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white dark:bg-gray-900 rounded-lg w-full max-w-lg p-6 shadow-xl transform scale-95 transition-transform"
        id="menuModalContent">
        <h3 id="menuModalTitle" class="text-lg font-bold mb-4">Create New Menu</h3>
        <form id="menuForm" onsubmit="event.preventDefault(); saveMenu();">
            <input type="hidden" id="menuId">

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Title *</label>
                    <input type="text" id="menuTitle" required
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">URL / Route</label>
                    <input type="text" id="menuUrl"
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm"
                        placeholder="/dashboard or #">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Icon (Material
                        Symbol)</label>
                    <input type="text" id="menuIcon"
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm"
                        placeholder="grid_view">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Sort Order</label>
                    <input type="number" id="menuOrder" value="0"
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Parent Menu</label>
                    <select id="menuParent"
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        <option value="">None (Top Level)</option>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Required
                        Permission</label>
                    <input type="text" id="menuPerm"
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm"
                        placeholder="e.g. report.view (optional)">
                </div>
            </div>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeMenuModal()"
                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm bg-primary text-white rounded hover:bg-blue-600 shadow-sm">Save
                    Menu</button>
            </div>
        </form>
    </div>
</div>
