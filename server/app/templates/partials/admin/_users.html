<!-- Users Tab Content -->
<div
    class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/30 dark:bg-gray-800/20 flex items-center justify-between shrink-0">
    <div>
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-gray-400">User Management</h3>
        <p class="text-[10px] text-gray-500 mt-0.5">Create and manage system users and their primary administrative
            status.</p>
    </div>
    <button onclick="openUserModal()"
        class="bg-primary hover:bg-blue-600 text-white px-3 py-1.5 rounded text-[11px] font-bold uppercase tracking-wider transition-colors flex items-center gap-1 shadow-md shadow-primary/20">
        <span class="material-symbols-outlined text-sm">person_add</span> New User
    </button>
</div>

<div class="p-4 flex flex-col gap-4 flex-1 overflow-hidden">
    <!-- Search and Filter -->
    <div class="flex gap-4 items-center shrink-0">
        <div class="relative w-1/3">
            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">search</span>
            <input type="text" id="userSearchInput" onkeyup="debounce(fetchUsers, 500)()"
                class="w-full pl-9 pr-3 py-2 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm shadow-sm"
                placeholder="Search by username or email...">
        </div>
    </div>

    <!-- User Table -->
    <div
        class="border border-gray-100 dark:border-gray-800 rounded-lg overflow-hidden flex-1 flex flex-col min-h-0 bg-white dark:bg-gray-900">
        <div class="overflow-y-auto flex-1 custom-scrollbar">
            <table class="w-full text-left text-[11px] border-collapse">
                <thead
                    class="text-[10px] text-gray-400 uppercase bg-gray-50 dark:bg-gray-800/50 sticky top-0 z-10 border-b border-gray-100 dark:border-gray-800">
                    <tr>
                        <th class="px-4 py-3 font-semibold">User ID</th>
                        <th class="px-4 py-3 font-semibold">Username</th>
                        <th class="px-4 py-3 font-semibold">Email</th>
                        <th class="px-4 py-3 font-semibold">Roles</th>
                        <th class="px-4 py-3 font-semibold">Joined</th>
                        <th class="px-4 py-3 font-semibold text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"
                    class="divide-y divide-gray-100 dark:divide-gray-800 text-gray-600 dark:text-gray-400">
                    <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-gray-400">
                            <span class="material-symbols-outlined block text-2xl mb-2 animate-spin">sync</span>
                            Loading users...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div
            class="p-3 border-t border-gray-100 dark:border-gray-800 bg-gray-50 dark:bg-gray-800/30 flex items-center justify-between shrink-0">
            <div class="text-[10px] text-gray-400 font-medium" id="userPaginationInfo">
                Showing 0 to 0 of 0 users
            </div>
            <div class="flex gap-1" id="userPaginationButtons">
                <!-- Pagination buttons generated via JS -->
            </div>
        </div>
    </div>
</div>

<!-- User Modal -->
<div id="userModal"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white dark:bg-gray-900 rounded-lg w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform"
        id="userModalContent">
        <h3 id="userModalTitle" class="text-lg font-bold mb-4">Create New User</h3>
        <form id="userForm" onsubmit="event.preventDefault(); saveUser();">
            <input type="hidden" id="manageUserId">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">User ID (Business)
                        *</label>
                    <input type="text" id="manageUserBizId" name="user_id" required
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary text-sm uppercase">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Username *</label>
                    <input type="text" id="manageUsername" name="username" required
                        class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary text-sm">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Email *</label>
                <input type="email" id="manageUserEmail" name="email" required
                    class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary text-sm">
            </div>
            <div class="mb-6">
                <label id="manageUserPassLabel"
                    class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Password *</label>
                <input type="password" id="manageUserPassword" name="password"
                    class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary text-sm">
                <p id="manageUserPassHint" class="text-[9px] text-gray-400 mt-1 hidden italic">Leave blank to keep
                    current password</p>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeUserModal()"
                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm bg-primary text-white rounded hover:bg-blue-600 shadow-sm shadow-primary/20">Save
                    User</button>
            </div>
        </form>
    </div>
</div>
