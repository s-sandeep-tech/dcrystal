<!-- Role Tab Content -->
<div
    class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/30 dark:bg-gray-800/20 flex items-center justify-between shrink-0">
    <div>
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-gray-400">Manage Roles</h3>
        <p class="text-[10px] text-gray-500 mt-0.5">Create, update, and manage system roles used for Access Control.</p>
    </div>
    <button onclick="openRoleModal()"
        class="bg-primary hover:bg-blue-600 text-white px-3 py-1.5 rounded text-[11px] font-bold uppercase tracking-wider transition-colors flex items-center gap-1 shadow-md shadow-primary/20">
        <span class="material-symbols-outlined text-sm">add</span> New Role
    </button>
</div>
<div class="p-0 overflow-x-auto overflow-y-auto max-h-[400px] flex-1">
    <table class="w-full text-left text-[11px] text-gray-500 dark:text-gray-400 border-collapse">
        <thead
            class="text-[10px] text-gray-400 uppercase bg-gray-50 dark:bg-gray-800 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-10">
            <tr>
                <th scope="col" class="px-4 py-3 font-semibold w-[10%] bg-gray-50 dark:bg-gray-800">ID</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[30%] bg-gray-50 dark:bg-gray-800">Role Name</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[35%] bg-gray-50 dark:bg-gray-800">Description</th>
                <th scope="col" class="px-4 py-3 font-semibold w-[25%] text-right bg-gray-50 dark:bg-gray-800">Actions
                </th>
            </tr>
        </thead>
        <tbody id="rolesTableBody" class="divide-y divide-gray-100 dark:divide-gray-800">
            <tr>
                <td colspan="4" class="px-4 py-8 text-center text-gray-400">
                    <span class="material-symbols-outlined block text-2xl mb-2 animate-spin">sync</span>
                    Loading roles...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Role Modal (Moved from end of settings page) -->
<div id="roleModal"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white dark:bg-gray-900 rounded-lg w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform"
        id="roleModalContent">
        <h3 id="roleModalTitle" class="text-lg font-bold mb-4">Create New Role</h3>
        <form id="roleForm" onsubmit="event.preventDefault(); saveRole();">
            <input type="hidden" id="roleId">
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Role Name *</label>
                <input type="text" id="roleName" required
                    class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm uppercase">
                <p class="text-[10px] text-gray-500 mt-1">E.g., ADMIN, MANAGER</p>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                <input type="text" id="roleDesc"
                    class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded focus:ring-1 focus:ring-primary focus:border-primary text-sm">
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeRoleModal()"
                    class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm bg-primary text-white rounded hover:bg-blue-600 shadow-sm">Save
                    Role</button>
            </div>
        </form>
    </div>
</div>

<!-- Role Menu Mapping Modal -->
<div id="roleMenuModal"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white dark:bg-gray-900 rounded-lg w-full max-w-2xl p-6 shadow-xl transform scale-95 transition-transform flex flex-col max-h-[90vh]"
        id="roleMenuModalContent">
        <div class="flex items-center justify-between mb-4 shrink-0">
            <div>
                <h3 class="text-lg font-bold">Assign Menus to Role</h3>
                <p id="mappingRoleName" class="text-xs text-primary font-bold uppercase tracking-widest mt-0.5">ROLE: -
                </p>
            </div>
            <button onclick="closeRoleMenuModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div
            class="flex-1 overflow-y-auto pr-2 custom-scrollbar min-h-0 mb-6 border-y border-gray-100 dark:border-gray-800 py-4">
            <div id="menuMappingGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Checkboxes populated via JS -->
            </div>
        </div>

        <div class="flex justify-end gap-2 shrink-0">
            <button type="button" onclick="closeRoleMenuModal()"
                class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">Cancel</button>
            <button type="button" id="saveRoleMenusBtn"
                class="px-4 py-2 text-sm bg-primary text-white rounded hover:bg-blue-600 shadow-sm">Update
                Mappings</button>
        </div>
    </div>
</div>
