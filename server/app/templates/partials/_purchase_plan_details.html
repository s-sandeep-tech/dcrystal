{% macro details(pieces, weight) -%}
<div class="whitespace-nowrap font-sans font-normal tabular-nums leading-tight">
    <div class="text-[12px] text-gray-700 dark:text-gray-200">
        {{ "{:,.3f}".format(weight / 1000) if weight is defined and weight is not none else 'N/A' }}</div>
    <div class="mt-0.5 text-[9px] text-gray-500 dark:text-gray-400">
        {{ "{:,.4f}".format(pieces).rstrip('0').rstrip('.') if pieces is defined and pieces is not none else 'N/A' }}</div>
</div>
{%- endmacro %}
