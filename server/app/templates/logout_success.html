<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Signed Out - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                    },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #137fec 0%, #6366f1 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .dark .glass {
            background: rgba(16, 25, 34, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md animate-in">
        <div class="glass rounded-2xl shadow-2xl p-10 transition-all duration-300 text-center">
            <div class="flex flex-col items-center mb-8">
                <div
                    class="size-20 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 rounded-full flex items-center justify-center mb-6 shadow-sm">
                    <span class="material-symbols-outlined text-5xl">check_circle</span>
                </div>
                <h1 class="text-3xl font-black text-gray-900 dark:text-white mb-3 tracking-tight">Signed out successfully</h1>
                
                <p class="text-gray-500 dark:text-gray-400 leading-relaxed max-w-[280px]">
                    You have been securely signed out of your account.
                </p>
            </div>

            <div class="space-y-4">
                <a href="/login"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-xl text-sm shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
                    <span class="material-symbols-outlined text-lg">login</span>
                    <span>Sign in again</span>
                </a>
                
                <a href="/"
                    class="w-full bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold py-4 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-lg">home</span>
                    <span>Go to Home</span>
                </a>
            </div>
        </div>
        
        <div class="mt-10 flex flex-col items-center gap-2 opacity-80">
            <div class="h-1 w-8 bg-white/30 rounded-full"></div>
            <p class="text-center text-white/70 text-[10px] font-medium uppercase tracking-[0.4em]">&copy; 2026 DCRYSTAL INTELLIGENCE</p>
        </div>
    </div>
</body>

</html>
