<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>403 Forbidden - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                    },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #137fec 0%, #6366f1 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .dark .glass {
            background: rgba(16, 25, 34, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass rounded-2xl shadow-2xl p-8 transition-all duration-300 text-center">
            <div class="flex flex-col items-center mb-6">
                <div
                    class="size-16 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-full flex items-center justify-center mb-4 shadow-sm">
                    <span class="material-symbols-outlined text-4xl">lock</span>
                </div>
                <h1 class="text-6xl font-black text-gray-900 dark:text-white mb-2 tracking-tighter">403</h1>
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 uppercase tracking-wide">Access Denied</h2>
                
                <div class="mt-4 p-4 bg-red-50 dark:bg-red-900/20 rounded-xl border border-red-100 dark:border-red-900/30">
                    <p class="text-[11px] font-bold text-red-500 uppercase tracking-widest mb-1 italic">Missing Permission</p>
                    <p class="text-sm font-mono text-gray-700 dark:text-gray-300 break-all bg-white/50 dark:bg-black/20 p-2 rounded border border-red-50/50">
                        {{ permission or 'REQUIRED_PERMISSION' }}
                    </p>
                </div>

                <p class="text-sm text-gray-500 dark:text-gray-400 mt-6 leading-relaxed">
                    You don't have enough privileges to access this resource. If you believe this is an error, please contact your administrator.
                </p>
            </div>

            <div class="space-y-3 mt-8">
                <a href="{{ url_for('dashboard.my_account') }}"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
                    <span class="material-symbols-outlined text-lg">person</span>
                    <span>GO TO MY ACCOUNT</span>
                </a>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.history.back()"
                        class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold py-3 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-2">
                        <span>GO BACK</span>
                    </button>
                    <a href="{{ url_for('auth.logout') }}"
                        class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-red-500 font-bold py-3 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-2">
                        <span>LOGOUT</span>
                    </a>
                </div>
            </div>
        </div>
        
        <div class="mt-8 flex flex-col items-center gap-2">
            <div class="h-1 w-8 bg-white/20 rounded-full"></div>
            <p class="text-center text-white/60 text-[10px] font-medium uppercase tracking-[0.3em]">&copy; 2026 DCRYSTAL INTELLIGENCE</p>
        </div>
    </div>
</body>

</html>
