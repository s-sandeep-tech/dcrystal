{% extends "base.html" %}

{% block title %}Unauthorized - DCrystal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center size-24 bg-amber-50 dark:bg-amber-900/20 rounded-full mb-4">
                <span class="material-symbols-outlined text-amber-500 text-5xl">lock_person</span>
            </div>
            <h1 class="text-4xl font-black text-gray-900 dark:text-white mb-2 tracking-tight">401</h1>
            <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">Unauthorized Access</h2>
            <p class="text-gray-600 dark:text-gray-400 mb-8 leading-relaxed">
                Your session has expired or you do not have permission to access this resource. Please log in to continue.
            </p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{{ url_for('dashboard.login') }}" 
               class="inline-flex items-center justify-center px-6 py-3 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg transition-all shadow-lg shadow-primary/25">
               <span class="material-symbols-outlined mr-2">login</span>
               Go to Login
            </a>
            <a href="{{ url_for('dashboard.index') }}" 
               class="inline-flex items-center justify-center px-6 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-all">
               <span class="material-symbols-outlined mr-2">home</span>
               Back Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
