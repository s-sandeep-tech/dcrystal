<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>500 Internal Error - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                    },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #137fec 0%, #6366f1 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .dark .glass {
            background: rgba(16, 25, 34, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass rounded-2xl shadow-2xl p-8 transition-all duration-300 text-center">
            <div class="flex flex-col items-center mb-6">
                <div
                    class="size-16 bg-orange-100 dark:bg-orange-900/30 text-orange-500 rounded-full flex items-center justify-center mb-4 shadow-sm">
                    <span class="material-symbols-outlined text-4xl">warning</span>
                </div>
                <h1 class="text-6xl font-black text-gray-900 dark:text-white mb-2 tracking-tighter">500</h1>
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200">Internal Server Error</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-3">Oops, something went wrong on our end. Please
                    try again later.</p>
            </div>

            <a href="/"
                class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-4 rounded-lg text-sm shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group mt-6 inline-flex">
                <span
                    class="material-symbols-outlined text-lg group-hover:-translate-x-1 transition-transform">arrow_back</span>
                <span>RETURN TO DASHBOARD</span>
            </a>
            <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800 text-center">
                <p class="text-xs text-gray-400">Need help? <a href="#"
                        class="text-primary font-bold hover:underline">Contact Support</a></p>
            </div>
        </div>
        <p class="text-center mt-6 text-white/60 text-xs font-medium uppercase tracking-[0.2em]">&copy; 2026 DCrystal
            Intelligence</p>
    </div>
</body>

</html>
