<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIS Account Activation - Kalyan Jewellers</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f6f2; color: #2d2627; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        main { width: min(100%, 460px); text-align: center; background: #fff; border: 1px solid #e8dfd2; border-radius: 12px; box-shadow: 0 10px 25px rgba(120, 16, 33, 0.08); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #500812 0%, #781021 100%); padding: 24px 32px; border-bottom: 3px solid #c5a059; display: flex; align-items: center; justify-content: space-between; }
        .card-body { padding: 36px 32px 32px; }
        .status-icon { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; font-size: 28px; font-weight: 700; }
        .success { color: #047857; background: #ecfdf5; border: 2px solid #a7f3d0; }
        .failure { color: #b91c1c; background: #fef2f2; border: 2px solid #fecaca; }
        h1 { margin: 0; font-size: 22px; color: #500812; font-weight: 700; }
        p { margin: 12px 0 0; color: #5c4e48; font-size: 14px; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 28px; padding: 12px 28px; color: #fff; background: #781021; border: 1px solid #500812; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 12px rgba(120, 16, 33, 0.2); transition: all 0.2s ease; }
        .btn:hover { background: #500812; box-shadow: 0 6px 16px rgba(120, 16, 33, 0.3); }
        .card-footer { padding: 16px 32px; background: #fbf9f5; border-top: 1px solid #ede3d4; font-size: 12px; color: #91847e; }
    </style>
</head>
<body>
    <main>
        <div class="card-header">
            <img src="https://www.kalyanjewellers.net/images/kalyan_logo.svg" alt="Kalyan Jewellers" height="36" style="display:block; height:36px; width:auto;" />
            <span style="color:#ffd875; font-weight:800; font-size:14px; letter-spacing:1px;">MIS PORTAL</span>
        </div>
        <div class="card-body">
            <div class="status-icon {{ 'success' if success else 'failure' }}">
                <span>{{ '&#10003;'|safe if success else '!' }}</span>
            </div>
            <h1>{{ 'Account Activated' if success else 'Activation Unsuccessful' }}</h1>
            <p>{{ message }}</p>
            {% if success %}
            <a href="/login" class="btn">Proceed to Login &rarr;</a>
            {% endif %}
        </div>
        <div class="card-footer">
            Kalyan Jewellers India Limited
        </div>
    </main>
</body>
</html>
