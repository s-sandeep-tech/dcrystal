<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verification</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #172033; font-family: Arial, sans-serif; }
        main { width: min(100%, 448px); padding: 32px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
        .status-icon { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; font-size: 24px; font-weight: 700; }
        .success { color: #059669; background: #ecfdf5; }
        .failure { color: #dc2626; background: #fef2f2; }
        h1 { margin: 0; font-size: 20px; }
        p { margin: 12px 0 0; color: #64748b; font-size: 14px; line-height: 1.6; }
        a { display: inline-flex; margin-top: 28px; padding: 10px 20px; color: #fff; background: #2563eb; border-radius: 6px; font-size: 14px; font-weight: 700; text-decoration: none; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <main>
        <div class="status-icon {{ 'success' if success else 'failure' }}">
            <span>{{ '&#10003;'|safe if success else '!' }}</span>
        </div>
        <h1>{{ 'Account activated' if success else 'Activation unsuccessful' }}</h1>
        <p>{{ message }}</p>
        {% if success %}
        <a href="/login">Continue to login</a>
        {% endif %}
    </main>
</body>
</html>
