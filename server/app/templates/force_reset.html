<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Password - DCrystal Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                    },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .dark .glass {
            background: rgba(16, 25, 34, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md animate-slide-in">
        <div class="glass rounded-2xl shadow-2xl p-8 transition-all duration-300">
            <div class="flex flex-col items-center mb-8 text-center">
                <div class="size-12 bg-amber-500 rounded-xl flex items-center justify-center text-white mb-4 shadow-lg">
                    <span class="material-symbols-outlined text-2xl">lock_reset</span>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Action Required</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">An administrator has forced a password reset for your account. You must change your password to continue.</p>
            </div>

            <form id="resetForm" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest pl-1">Current Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">lock</span>
                        <input id="current_password" type="password" required
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all dark:text-white"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest pl-1">New Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">key</span>
                        <input id="new_password" type="password" required minlength="4"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all dark:text-white"
                            placeholder="New secure password">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-bold text-gray-400 uppercase tracking-widest pl-1">Confirm New Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">verified_user</span>
                        <input id="confirm_password" type="password" required minlength="4"
                            class="w-full pl-10 pr-4 py-2.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all dark:text-white"
                            placeholder="Confirm new password">
                    </div>
                </div>

                <div id="errorMsg"
                    class="hidden p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/30 rounded-lg text-[11px] text-red-600 font-bold flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">error</span>
                    <span id="errorText">Error updating password</span>
                </div>

                <div id="successMsg"
                    class="hidden p-3 bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-900/30 rounded-lg text-[11px] text-green-600 font-bold flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">check_circle</span>
                    <span>Password updated! Redirecting...</span>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg text-sm shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 group">
                    <span>UPDATE PASSWORD</span>
                    <span class="material-symbols-outlined text-lg group-hover:rotate-180 transition-transform">sync</span>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 text-center">
                <a href="/login" class="text-xs text-gray-400 hover:text-primary font-bold">Back to Login</a>
            </div>
        </div>

        <p class="text-center mt-6 text-white/60 text-xs font-medium uppercase tracking-[0.2em]">&copy; 2026 DCrystal Intelligence</p>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const current_password = document.getElementById('current_password').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (new_password !== confirm_password) {
                errorText.textContent = "New passwords do not match";
                errorMsg.classList.remove('hidden');
                return;
            }

            function validatePassword(pw) {
                const minLength = pw.length >= 6;
                const hasUpper = /[A-Z]/.test(pw);
                const hasLower = /[a-z]/.test(pw);
                const hasNumber = /\d/.test(pw);
                const hasSpecial = /[^a-zA-Z\d\s]/.test(pw);
                const noSpace = !/\s/.test(pw);

                if (!minLength) return "Password must be at least 6 characters long";
                if (!noSpace) return "Spaces are not allowed in the password";
                if (!hasUpper) return "Password must contain at least one uppercase letter";
                if (!hasLower) return "Password must contain at least one lowercase letter";
                if (!hasNumber) return "Password must contain at least one numeric digit";
                if (!hasSpecial) return "Password must contain at least one special character";
                return null;
            }

            const strengthError = validatePassword(new_password);
            if (strengthError) {
                errorText.textContent = strengthError;
                errorMsg.classList.remove('hidden');
                return;
            }

            if (new_password === current_password) {
                errorText.textContent = "New password cannot be same as current";
                errorMsg.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="size-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/update-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password, new_password, confirm_password })
                });

                const data = await response.json();

                if (response.ok) {
                    successMsg.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    errorText.textContent = data.msg || 'Update failed';
                    errorMsg.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>UPDATE PASSWORD</span><span class="material-symbols-outlined text-lg">sync</span>';
                }
            } catch (error) {
                errorText.textContent = 'Server connection failed';
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>UPDATE PASSWORD</span><span class="material-symbols-outlined text-lg">sync</span>';
            }
        });
    </script>
</body>

</html>
